# Kicks off the chatbot sync chain shortly after a portfolio push.
#
# Deployment itself is handled by Vercel's native Git integration (connected
# once in the Vercel dashboard — see DEPLOYMENT.md), not by this workflow —
# that needs no tokens or secrets here at all. This workflow's only job is:
# wait for Vercel's own auto-deploy to finish, then trigger the scrape so the
# chatbot picks up the change immediately instead of waiting for the next
# 6-hour cron tick.
#
# index.html push -> Vercel auto-deploys (its own integration) -> this
# workflow waits, then triggers scrape-and-reindex.yml -> it re-scrapes the
# now-live site and commits content/portfolio.md if it changed -> that commit
# triggers reindex.yml (path filter on content/**) -> chatbot knows about it.

name: Sync Chatbot After Portfolio Push

on:
  push:
    branches: [main]
    paths:
      - "portfolio-site/**"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write   # needed to trigger scrape-and-reindex.yml below

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Give Vercel's own auto-deploy time to go live
        run: sleep 45

      - name: Trigger portfolio scrape + reindex
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run scrape-and-reindex.yml --repo "${{ github.repository }}"

